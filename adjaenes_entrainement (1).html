<style>

*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15px;line-height:1.6}
.app{max-width:700px;margin:0 auto;padding:24px 16px 60px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:24px;flex-wrap:wrap;gap:12px}
.logo{font-size:20px;font-weight:700;letter-spacing:-0.5px}
.logo span{color:var(--accent)}
.score-row{display:flex;gap:8px}
.pill{font-size:12px;font-weight:600;padding:4px 10px;border-radius:20px;background:var(--surface);border:1px solid var(--border);color:var(--muted)}
.pill.streak{background:#FFFBEB;color:#92400E;border-color:#FCD34D}
.themes{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
.tbtn{font-size:12px;font-weight:500;padding:6px 12px;border-radius:20px;border:1px solid var(--border);background:var(--surface);color:var(--muted);cursor:pointer;transition:all .15s}
.tbtn:hover{border-color:var(--accent);color:var(--accent)}
.tbtn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pw{background:var(--border);border-radius:4px;height:4px;margin-bottom:20px;overflow:hidden}
.pb{height:4px;background:var(--accent);border-radius:4px;transition:width .4s ease}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:24px;margin-bottom:16px}
.qm{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;color:var(--muted);margin-bottom:12px}
.qt{font-size:16px;line-height:1.7;color:var(--text);margin-bottom:20px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.opt{padding:12px 16px;border:1px solid var(--border);border-radius:var(--rs);cursor:pointer;font-size:14px;color:var(--text);background:var(--bg);text-align:left;transition:all .15s;font-family:inherit}
.opt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-light);color:var(--accent)}
.opt.ok{border-color:var(--success);background:var(--success-bg);color:var(--success);font-weight:600}
.opt.ko{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.fr{display:flex;gap:8px;margin-bottom:12px}
.fr input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--rs);font-size:14px;font-family:inherit;background:var(--bg);color:var(--text);outline:none;transition:border-color .15s}
.fr input:focus{border-color:var(--accent);background:#fff}
.fr input.ok{border-color:var(--success);background:var(--success-bg);color:var(--success)}
.fr input.ko{border-color:var(--danger);background:var(--danger-bg);color:var(--danger)}
.btn{padding:10px 18px;border-radius:var(--rs);border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--bg)}
.btn.p{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.p:hover{background:#1e4bc0}
.fb{padding:12px 16px;border-radius:var(--rs);font-size:13px;line-height:1.6;margin-bottom:16px;display:none}
.fb.ok{background:var(--success-bg);color:var(--success);border:1px solid #86EFAC}
.fb.ko{background:var(--danger-bg);color:var(--danger);border:1px solid #FCA5A5}
.fb .rl{display:block;margin-top:6px;font-size:12px;font-style:italic;opacity:.85}
.br{display:flex;gap:8px;flex-wrap:wrap}
.rg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
.st{background:var(--bg);border-radius:var(--rs);padding:14px;text-align:center;border:1px solid var(--border)}
.sn{font-size:28px;font-weight:700;color:var(--accent)}
.sl{font-size:11px;color:var(--muted);margin-top:2px;font-weight:500}
</style>
</head>

// Fonction de normalisation STRICTE : uniquement accents et casse
function norm(s){
  return s.toString().trim()
    .toLowerCase()
    .replace(/[éèêë]/g,'e')
    .replace(/[àâä]/g,'a')
    .replace(/[îï]/g,'i')
    .replace(/[ôö]/g,'o')
    .replace(/[ùûü]/g,'u')
    .replace(/ç/g,'c')
    .replace(/['\u2019\u2018]/g,"'")
    .replace(/\s+/g,' ')
    .trim();
}

// Comparaison stricte pour le texte, souple uniquement pour les nombres
function checkAnswer(userRaw, correctRaw){
  // Les réponses acceptées sont séparées par " | "
  const accepted = correctRaw.split('|').map(a => a.trim());
  const userN = norm(userRaw);

  for(const a of accepted){
    // Pour les réponses numériques pures : comparer les valeurs
    const aNum = parseFloat(a.replace(',','.').replace(/[^0-9.\-]/g,''));
    const uNum = parseFloat(userN.replace(',','.').replace(/[^0-9.\-]/g,''));
    if(!isNaN(aNum) && !isNaN(uNum) && a.replace(/[^0-9.\-]/g,'') === a.replace(/\s/g,'') && userN.replace(/[^0-9.\-]/g,'') === userN.replace(/\s/g,'')){
      if(Math.abs(aNum - uNum) < 0.01) return true;
    }
    // Pour le texte : comparaison normalisée stricte
    if(norm(a) === userN) return true;
  }
  return false;
}

  {q:"Prix initial 250€, remise de 30€. Taux de remise en % ?",t:'f',a:'12',r:"30/250 × 100 = 12%"},
  {q:"12 000€ ordinateurs sur budget total 45 000€. Pourcentage ?",t:'f',a:'26.67',r:"12 000/45 000 × 100 ≈ 26,67%"},
  {q:"80 207 kWh annuels. Consommation mensuelle moyenne ?",t:'f',a:'6684',r:"80 207 ÷ 12 ≈ 6 684 kWh"},
  {q:"Article passe de 150€ à 120€. Baisse en % ?",t:'f',a:'20',r:"(150-120)/150 × 100 = 20%"},
  {q:"TVA collectée sur vente TTC de 2 400€ (TVA 20%) ?",t:'f',a:'400',r:"HT = 2 400/1,20 = 2 000€ ; TVA = 2 400 - 2 000 = 400€"},
  {q:"+15% sur 60 000€. Nouveau budget ?",t:'f',a:'69000',r:"60 000 × 1,15 = 69 000€"},
  {q:"Deux remises successives de 10% sur 10 000€. Total des remises économisées ?",t:'f',a:'1900',r:"10 000×0,9=9 000 (remise1=1000) ; 9 000×0,9=8 100 (remise2=900) → total = 1 900€"},
  {q:"3 150€ dans 9 000€ exprimé en % ?",t:'f',a:'35',r:"3 150 ÷ 9 000 × 100 = 35%"},
  {q:"+15% sur prix kWh de 0,12921€. Nouveau prix arrondi à 4 décimales ?",t:'f',a:'0.1486',r:"0,12921 × 1,15 ≈ 0,1486€/kWh"}
]
};

let theme='pp',idx=0,answered=false,score=0,total=0,streak=0,queue=[];

function shuffle(a){const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}

function checkAnswer(userRaw, correctRaw){
  const userTrimmed = userRaw.trim();
  if(!userTrimmed) return false;

  const accepted = correctRaw.split('|').map(a => a.trim());

  for(const correct of accepted){
    // Test numérique pur : extraire le nombre et comparer
    const correctOnlyNum = correct.replace(/\s/g,'').replace(',','.');
    const userOnlyNum = userTrimmed.replace(/\s/g,'').replace(',','.');
    const cn = parseFloat(correctOnlyNum);
    const un = parseFloat(userOnlyNum);

    // Si la réponse correcte EST un nombre (rien d'autre)
    if(!isNaN(cn) && /^-?[0-9]+([.,][0-9]+)?$/.test(correctOnlyNum)){
      if(!isNaN(un) && Math.abs(cn - un) < 0.02) return true;
    } else {
      // Comparaison textuelle normalisée (accents + casse uniquement)
      if(norm(correct) === norm(userTrimmed)) return true;
    }
  }
  return false;
}

function initQ(){queue=shuffle([...Q[theme]]);idx=0;answered=false}

function upUI(){
  document.getElementById('sp').textContent='✓ '+score+' / '+total;
  document.getElementById('sk').textContent='🔥 '+streak;
  document.getElementById('pb').style.width=(queue.length?(idx/queue.length*100):0)+'%';
}

function renderTabs(){
  document.getElementById('th').innerHTML=TH.map(t=>`<button class="tbtn${t.id===theme?' active':''}" onclick="setTheme('${t.id}')">${t.l}</button>`).join('');
}

function setTheme(t){theme=t;initQ();renderTabs();render()}

function render(){
  upUI();
  const main=document.getElementById('main');
  if(idx>=queue.length){
    const pct=total>0?Math.round(score/total*100):0;
    const em=pct>=80?'🎉':pct>=60?'👍':'💪';
    main.innerHTML=`<div class="card"><div class="qm">${em} Thème terminé !</div><div class="rg"><div class="st"><div class="sn">${score}</div><div class="sl">Bonnes réponses</div></div><div class="st"><div class="sn">${total}</div><div class="sl">Questions</div></div><div class="st"><div class="sn">${pct}%</div><div class="sl">Réussite</div></div></div><div class="br"><button class="btn p" onclick="restart()">↺ Recommencer</button><button class="btn" onclick="nextTA()">Thème suivant →</button></div></div>`;
    return;
  }
  const q=queue[idx];
  const tn=TH.find(t=>t.id===theme).l;
  let h=`<div class="card"><div class="qm">Question ${idx+1} / ${queue.length} — ${tn}</div><div class="qt">${q.q}</div>`;
  if(q.t==='q'){
    h+=`<div class="opts">`+q.o.map((o,i)=>`<button class="opt" id="o${i}" onclick="cQ(this,'${o.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}')">${o}</button>`).join('')+`</div>`;
  } else {
    h+=`<div class="fr"><input type="text" id="ai" placeholder="Votre réponse..." autocomplete="off" spellcheck="false" onkeydown="if(event.key==='Enter')cF()"/><button class="btn p" onclick="cF()">Valider</button></div>`;
  }
  h+=`<div id="fb" class="fb"></div><div class="br" id="nw" style="display:none"><button class="btn p" onclick="nx()">Question suivante →</button></div></div>`;
  main.innerHTML=h;
  if(q.t==='f') setTimeout(()=>{const i=document.getElementById('ai');if(i)i.focus()},80);
}

function cQ(btn,val){
  if(answered)return;
  answered=true;total++;
  const q=queue[idx];
  const ok=(val===q.a);
  if(ok){score++;streak++;btn.className='opt ok';}
  else{streak=0;btn.className='opt ko';document.querySelectorAll('.opt').forEach(b=>{if(b.textContent===q.a)b.className='opt ok'});}
  document.querySelectorAll('.opt').forEach(b=>b.disabled=true);
  showFB(ok,q,null);
}

function cF(){
  if(answered)return;
  const inp=document.getElementById('ai');
  if(!inp||!inp.value.trim())return;
  answered=true;total++;
  const q=queue[idx];
  const uv=inp.value;
  const ok=checkAnswer(uv, q.a);
  inp.disabled=true;
  inp.className=ok?'ok':'ko';
  if(ok){score++;streak++;}else{streak=0;}
  showFB(ok,q,uv);
}

function showFB(ok,q,uv){
  const fb=document.getElementById('fb');
  fb.style.display='block';
  fb.className='fb '+(ok?'ok':'ko');
  let t=ok
    ?'<strong>✓ Correct !</strong>'
    :`<strong>✗ Incorrect.</strong>${uv?` Votre réponse : <em>${uv.trim()}</em>. `:''} Réponse attendue : <strong>${q.a}</strong>.`;
  t+=`<span class="rl">📌 ${q.r}</span>`;
  fb.innerHTML=t;
  document.getElementById('nw').style.display='flex';
  upUI();
}

function nx(){idx++;answered=false;render()}
function restart(){score=0;total=0;streak=0;initQ();render()}
function nextTA(){const i=TH.findIndex(t=>t.id===theme);setTheme(TH[(i+1)%TH.length].id)}

initQ();renderTabs();render();
</script>
